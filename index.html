<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NutriTrack - Calorie Tracker</title>
    <meta name="description" content="Track your daily calories, macros, and nutrition goals with ease. A beautiful calorie tracking app for your health journey." />
    <meta name="author" content="NutriTrack" />
    <meta name="theme-color" content="#22c55e" />

    <meta property="og:title" content="NutriTrack - Calorie Tracker" />
    <meta property="og:description" content="Track your daily calories, macros, and nutrition goals with ease." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@NutriTrack" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Prevent flash of wrong theme on load -->
    <script>
      (function() {
        var theme = localStorage.getItem('nutritrack_theme') || 'system';
        var isDark = theme === 'dark' || 
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
